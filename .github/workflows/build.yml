# Builds every lineup page in batch_users and publishes them to GitHub Pages.
# Runs on a schedule (times below are UTC; US Eastern is UTC-4 in EDT, UTC-5 in EST),
# on pushes to main, and by hand from the Actions tab ("Run workflow").
# Builds run on any branch so a feature branch can be checked; only main deploys.
name: Build and deploy lineups

on:
  schedule:
    # Hourly, every day, from 7 AM to midnight ET plus one 4 AM run. These UTC hours cover
    # those times in both EDT and EST; the "when" job drops the extra hour each season.
    - cron: "0 0-5,8,9,11-23 * * *"
    - cron: "*/15 16-23 * * 0"   # every 15 min, Sunday noon to 8 PM ET
    - cron: "*/15 0-4 * * 1"     # every 15 min, Sunday 8 PM to midnight ET
    - cron: "*/15 23 * * 1,4"    # Monday and Thursday night games, 7 PM ET...
    - cron: "*/15 0-4 * * 2,5"   # ...to midnight ET
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      week:
        description: "Week to build (blank = next week with games left)"
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Quiet overnight: the hourly schedule only builds at midnight, 4 AM and 7 AM-11 PM
  # Eastern. Game-window runs, pushes and manual runs always build.
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          hour=$(TZ=America/New_York date +%-H)
          go=true
          if [ "$SCHEDULE" = "0 0-5,8,9,11-23 * * *" ]; then
            case "$hour" in 1|2|3|5|6) go=false ;; esac
          fi
          echo "Eastern hour $hour, build: $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sleeper API cache (player list, finished weeks' stats) plus roster snapshots,
      # so each run downloads less and can still spot adds and drops.
      - name: Restore Sleeper cache
        uses: actions/cache@v4
        with:
          path: data
          key: sleeper-data-${{ github.run_id }}
          restore-keys: sleeper-data-

      - name: Build pages
        env:
          WEEK: ${{ github.event.inputs.week }}
          FF_RECORD: ${{ runner.temp }}/sleeper-responses   # replayed by the parity check
        run: |
          python3 batchbenchpress.py --no-open --site site ${WEEK:+-w "$WEEK"}

      # Does the Refresh button (web/benchpress.js) pick the same lineups as the Python?
      # Non-blocking so a JavaScript slip never stops the pages from updating; a failure
      # shows as a warning on the run with the differences in the log.
      - name: Parity check (Python vs JavaScript)
        continue-on-error: true
        run: |
          node tools/parity.js site "$RUNNER_TEMP/sleeper-responses" data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
